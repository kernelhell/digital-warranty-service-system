version: "3.9"

services:
  app:
    build: .
    container_name: warranty_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=warranty_db
      - DB_USER=warranty_user
      - DB_PASS=warranty_pass
    depends_on:
      - db
    networks:
      - warranty_net

  db:
    image: mysql:8.0
    container_name: warranty_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=warranty_db
      - MYSQL_USER=warranty_user
      - MYSQL_PASSWORD=warranty_pass
    ports:
      - "3307:3306"
    volumes:
      - warranty_db_data:/var/lib/mysql
    networks:
      - warranty_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  warranty_db_data:

networks:
  warranty_net:
    driver: bridge
