name: Digital Warranty CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and smoke-test application
    runs-on: ubuntu-latest
    defaults:
    run:
      working-directory: ./digital-warranty-service-system
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start database
        run: docker compose up -d db

      - name: Wait for MySQL health check
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' warranty_db 2>/dev/null || true)"
            echo "MySQL status: ${status:-starting}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs db
          echo "MySQL did not become healthy in time."
          exit 1

      - name: Build and start application
        run: docker compose up -d --build app

      - name: Smoke-test application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3000/ > /tmp/homepage.html; then
              echo "Application returned HTTP success."
              grep -qi "Warranty\|Service" /tmp/homepage.html || true
              exit 0
            fi
            echo "Waiting for application..."
            sleep 5
          done
          docker compose logs app db
          echo "Application did not become ready in time."
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs app db

      - name: Stop test containers
        if: always()
        run: docker compose down

  publish:
    name: Publish image to Docker Hub
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./digital-warranty-service-system
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/digital-warranty-service-system:latest
            ${{ secrets.DOCKER_USERNAME }}/digital-warranty-service-system:${{ github.sha }}
